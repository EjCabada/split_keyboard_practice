<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanata Intent Trainer</title>
    <style>
        :root {
            --bg-color: #f4f4f5;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --panel-bg: #ffffff;
            --border-color: #e5e7eb;
        }

        body.dark-mode {
            --bg-color: #18181b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --panel-bg: #27272a;
            --border-color: #3f3f46;
            --accent-green: #34d399;
            --accent-red: #f87171;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
        }

        /* --- UI Controls --- */
        .controls {
            display: flex;
            gap: 15px;
            padding: 15px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            flex-wrap: wrap;
            z-index: 10;
        }

        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover, select:hover { opacity: 0.8; }

        /* Custom Toggle Switch */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white; transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* --- Screens --- */
        .screen {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            user-select: none;
            width: 100%;
        }

        #practice-screen { display: none; }

        /* --- Text Styling --- */
        .primary-text {
            font-size: 5rem;
            font-weight: 800;
            transition: color 0.1s;
        }

        .secondary-text {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-top: 15px;
            font-family: monospace;
            height: 2rem;
        }

        .feedback-text {
            font-size: 1.2rem;
            color: var(--accent-red);
            margin-top: 10px;
            height: 1.5rem;
            font-weight: bold;
            opacity: 0;
        }

        .text-success { color: var(--accent-green) !important; }
        .text-error { color: var(--accent-red) !important; }

        /* --- Stats --- */
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            font-size: 14px;
        }
        .stat-box { text-align: center; }
        .stat-value { font-weight: bold; font-size: 18px; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="controls">
        <select id="mode-select">
            <option value="0">Mode 0: Mixed (All)</option>
            <option value="1" selected>Mode 1: Mac / Gen Shortcuts</option>
            <option value="2">Mode 2: Kanata Numpad</option>
            <option value="3">Mode 3: AeroSpace vs Mac</option>
            <option value="4">Mode 4: Advanced Navigation</option>
        </select>

        <label class="toggle-wrapper">
            <div class="switch"><input type="checkbox" id="homerow-toggle" checked><span class="slider"></span></div>
            Require Alternation
        </label>

        <label class="toggle-wrapper">
            <div class="switch"><input type="checkbox" id="hide-hints-toggle"><span class="slider"></span></div>
            Hide Key Hints
        </label>

        <button id="dark-toggle">🌙 Dark Mode</button>
        <button id="pause-btn">⏸ Pause</button>
        <button id="restart-btn">🔄 Restart</button>
    </div>

    <div id="validation-screen" class="screen">
        <div class="primary-text" style="font-size: 3rem;">Validation Check</div>
        <div class="secondary-text">Press the <b style="color:var(--text-main);">/</b> key to continue.</div>
        <div class="feedback-text" id="val-feedback" style="opacity: 1; color: var(--text-muted);">
            (Reminder: Hyper + p activates practice layer)
        </div>
        <button id="corne-bypass-btn" style="margin-top: 30px; font-size: 1.2rem;">Bypass (Using Corne)</button>
    </div>

    <div id="practice-screen" class="screen">
        <div id="meaning-display" class="primary-text"></div>
        <div id="keys-display" class="secondary-text"></div>
        <div id="feedback-display" class="feedback-text"></div>
    </div>

    <div class="stats">
        <div class="stat-box">Accuracy<div class="stat-value" id="stat-acc">100%</div></div>
        <div class="stat-box">Total<div class="stat-value" id="stat-total">0</div></div>
        <div class="stat-box">Most Missed<div class="stat-value" id="stat-missed">None</div></div>
    </div>

    <script>
        // --- Shortcut Dictionaries ---
        const homeRowKeys = [
            { meaning: 'Home Row', keys: 'a', target: 'a' }, { meaning: 'Home Row', keys: 's', target: 's' },
            { meaning: 'Home Row', keys: 'd', target: 'd' }, { meaning: 'Home Row', keys: 'f', target: 'f' },
            { meaning: 'Home Row', keys: 'g', target: 'g' }, { meaning: 'Home Row', keys: 'h', target: 'h' },
            { meaning: 'Home Row', keys: 'j', target: 'j' }, { meaning: 'Home Row', keys: 'k', target: 'k' },
            { meaning: 'Home Row', keys: 'l', target: 'l' }, { meaning: 'Home Row', keys: ',', target: ',' },
            { meaning: 'Home Row', keys: '.', target: '.' }
        ];

        const dicts = {
            1: [ // Normal Mac Shortcuts
                { meaning: 'Select All', keys: 'Cmd + a', target: 'cmd+a' }, { meaning: 'New Tab', keys: 'Cmd + t', target: 'cmd+t' },
                { meaning: 'Redo', keys: 'Cmd + y', target: 'cmd+y' }, { meaning: 'Open', keys: 'Cmd + o', target: 'cmd+o' },
                { meaning: 'Print', keys: 'Cmd + p', target: 'cmd+p' }, { meaning: 'Quit App', keys: 'Cmd + q', target: 'cmd+q' },
                { meaning: 'Close Window', keys: 'Cmd + w', target: 'cmd+w' }, { meaning: 'Copy', keys: 'Cmd + c', target: 'cmd+c' },
                { meaning: 'Paste', keys: 'Cmd + v', target: 'cmd+v' }, { meaning: 'Undo', keys: 'Cmd + z', target: 'cmd+z' },
                { meaning: 'Cut', keys: 'Cmd + x', target: 'cmd+x' }, { meaning: 'Save', keys: 'Cmd + s', target: 'cmd+s' },
                { meaning: 'Reopen Tab', keys: 'Cmd + Shift + t', target: 'cmd+shift+t' },
                { meaning: 'Hidden Files', keys: 'Cmd + Shift + .', target: 'cmd+shift+.' },
                { meaning: 'Zoom In', keys: 'Cmd + +', target: 'cmd+=' }, { meaning: 'Zoom Out', keys: 'Cmd + -', target: 'cmd+-' },
            ],
            2: [ // Numpad
                { meaning: 'Number 1', keys: 'Hold g + u', target: '1' }, { meaning: 'Number 2', keys: 'Hold g + i', target: '2' },
                { meaning: 'Number 3', keys: 'Hold g + o', target: '3' }, { meaning: 'Number 4', keys: 'Hold g + j', target: '4' },
                { meaning: 'Number 5', keys: 'Hold g + k', target: '5' }, { meaning: 'Number 6', keys: 'Hold g + l', target: '6' },
                { meaning: 'Number 7', keys: 'Hold g + m', target: '7' }, { meaning: 'Number 8', keys: 'Hold g + ,', target: '8' },
                { meaning: 'Number 9', keys: 'Hold g + .', target: '9' }, { meaning: 'Number 0', keys: 'Hold g + p', target: '0' },
            ],
            3: [ // AeroSpace vs Mac
                { meaning: 'Workspace 1', keys: 'Alt + 1', target: 'alt+1' }, { meaning: 'Workspace 2', keys: 'Alt + 2', target: 'alt+2' },
                { meaning: 'Workspace 3', keys: 'Alt + 3', target: 'alt+3' }, { meaning: 'Workspace 4', keys: 'Alt + 4', target: 'alt+4' },
                { meaning: 'Workspace 5', keys: 'Alt + 5', target: 'alt+5' }, { meaning: 'Workspace 6', keys: 'Alt + 6', target: 'alt+6' },
                { meaning: 'Workspace Q', keys: 'Alt + q', target: 'alt+q' }, { meaning: 'Workspace W', keys: 'Alt + w', target: 'alt+w' },
                { meaning: 'Quit App', keys: 'Cmd + q', target: 'cmd+q' }, { meaning: 'Close Window', keys: 'Cmd + w', target: 'cmd+w' },
            ]
        };

        // Build Mode 4 and Mode 0 dynamically
        dicts[4] = [...dicts[3], 
            { meaning: 'Focus Left', keys: 'Alt + h', target: 'alt+h' }, { meaning: 'Focus Down', keys: 'Alt + j', target: 'alt+j' },
            { meaning: 'Focus Up', keys: 'Alt + k', target: 'alt+k' }, { meaning: 'Focus Right', keys: 'Alt + l', target: 'alt+l' },
            { meaning: 'Resize Larger', keys: 'Alt + Shift + +', target: 'alt+shift+=' }, { meaning: 'Resize Smaller', keys: 'Alt + Shift + -', target: 'alt+shift+-' }
        ];
        dicts[0] = [...dicts[1], ...dicts[2], ...dicts[4]];

        const modMap = { 'F13': 'shift', 'F20': 'shift', 'F14': 'ctrl', 'F19': 'ctrl', 'F15': 'alt', 'F18': 'alt', 'F16': 'cmd', 'F17': 'cmd' };

        // --- Application State ---
        let isValidated = false;
        let activeMods = new Set();
        let activeDict = dicts[1];
        let shuffleBag = [];
        let currentPrompt = null;
        let isShortcutTurn = true; 
        let retryQueue = [];
        let hasFailedCurrent = false;
        let isPaused = false;
        let stats = { correct: 0, total: 0, misses: {} };

        // --- DOM Elements ---
        const valScreen = document.getElementById('validation-screen');
        const pracScreen = document.getElementById('practice-screen');
        const displayMeaning = document.getElementById('meaning-display');
        const displayKeys = document.getElementById('keys-display');
        const displayFeedback = document.getElementById('feedback-display');
        const hrToggle = document.getElementById('homerow-toggle');
        const hintsToggle = document.getElementById('hide-hints-toggle');

        // --- Core Functions ---
        function formatPressedString(mods, key) {
            let arr = [];
            if (mods.has('cmd')) arr.push('Cmd');
            if (mods.has('ctrl')) arr.push('Ctrl');
            if (mods.has('alt')) arr.push('Alt');
            if (mods.has('shift')) arr.push('Shift');
            if (key !== 'unidentified' && !modMap[key.toUpperCase()]) arr.push(key);
            return arr.join(' + ') || "Unknown";
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getNextFromBag() {
            if (shuffleBag.length === 0) shuffleBag = shuffleArray(activeDict);
            return shuffleBag.pop();
        }

        function unlockGame() {
            isValidated = true;
            valScreen.style.display = 'none';
            pracScreen.style.display = 'flex';
            resetGame();
        }

        function resetGame() {
            stats = { correct: 0, total: 0, misses: {} };
            retryQueue = [];
            shuffleBag = [];
            activeMods.clear();
            hasFailedCurrent = false;
            displayFeedback.style.opacity = '0';
            updateStatsUI();
            setNextPrompt();
        }

        function updateStatsUI() {
            const acc = stats.total === 0 ? 100 : Math.round((stats.correct / stats.total) * 100);
            document.getElementById('stat-acc').innerText = `${acc}%`;
            document.getElementById('stat-total').innerText = stats.total;
            if (Object.keys(stats.misses).length === 0) {
                document.getElementById('stat-missed').innerText = "None";
            } else {
                const worst = Object.keys(stats.misses).reduce((a, b) => stats.misses[a] > stats.misses[b] ? a : b);
                document.getElementById('stat-missed').innerText = `${worst} (${stats.misses[worst]})`;
            }
        }

        function setNextPrompt() {
            if (isPaused) return;
            hasFailedCurrent = false;
            displayMeaning.className = 'primary-text'; // Reset color

            if (hrToggle.checked && !isShortcutTurn) {
                currentPrompt = homeRowKeys[Math.floor(Math.random() * homeRowKeys.length)];
            } else {
                currentPrompt = retryQueue.length > 0 ? retryQueue.shift() : getNextFromBag();
            }

            displayMeaning.innerText = currentPrompt.meaning;
            displayKeys.innerText = currentPrompt.keys;
            displayKeys.style.visibility = hintsToggle.checked ? 'hidden' : 'visible';
        }

        // --- Event Listeners ---
        window.addEventListener('keydown', (e) => {
            e.preventDefault(); 
            if (e.repeat || isPaused) return;

            // Phase 1: Validation
            if (!isValidated) {
                if (e.key === 'd') {
                    unlockGame();
                } else if (e.key === '/') {
                    document.getElementById('val-feedback').innerText = "❌ Standard keyboard detected. Activate Practice Layer (Hyper + p).";
                    document.getElementById('val-feedback').style.color = "var(--accent-red)";
                }
                return;
            }

            // Phase 2: Practice
            if (modMap[e.key]) { activeMods.add(modMap[e.key]); return; }

            let key = e.key.toLowerCase();
            if (key === '+') key = '=';

            let chordArr = [];
            if (activeMods.has('cmd')) chordArr.push('cmd');
            if (activeMods.has('ctrl')) chordArr.push('ctrl');
            if (activeMods.has('alt')) chordArr.push('alt');
            if (activeMods.has('shift')) chordArr.push('shift');
            chordArr.push(key);

            let pressedString = chordArr.join('+');

            if (pressedString === currentPrompt.target) {
                // Success
                displayMeaning.className = 'primary-text text-success';
                displayFeedback.style.opacity = '0';
                stats.correct++;
                stats.total++;
                if (hrToggle.checked) isShortcutTurn = !isShortcutTurn;
                activeMods.clear(); 
                setTimeout(setNextPrompt, 150);
            } else {
                // Failure
                displayMeaning.className = 'primary-text text-error';
                
                // Show what they actually pressed
                displayFeedback.innerText = `You pressed: ${formatPressedString(activeMods, e.key)}`;
                displayFeedback.style.opacity = '1';

                // If hints are hidden, reveal them on a mistake
                if (hintsToggle.checked) displayKeys.style.visibility = 'visible';

                stats.total++;
                if (currentPrompt.meaning !== 'Home Row') {
                    stats.misses[currentPrompt.meaning] = (stats.misses[currentPrompt.meaning] || 0) + 1;
                    if (!hasFailedCurrent) {
                        retryQueue.push(currentPrompt, currentPrompt, currentPrompt);
                        hasFailedCurrent = true;
                    }
                }

                setTimeout(() => {
                    if (!isPaused) displayMeaning.className = 'primary-text';
                }, 300);
            }
            updateStatsUI();
        });

        window.addEventListener('keyup', (e) => {
            if (modMap[e.key]) activeMods.delete(modMap[e.key]);
        });

        // UI Listeners
        document.getElementById('corne-bypass-btn').addEventListener('click', unlockGame);
        
        document.getElementById('mode-select').addEventListener('change', (e) => {
            activeDict = dicts[e.target.value];
            isShortcutTurn = true;
            resetGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => { isShortcutTurn = true; resetGame(); });
        
        document.getElementById('hints-toggle')

        document.getElementById('pause-btn').addEventListener('click', (e) => {
            isPaused = !isPaused;
            if (isPaused) {
                e.target.innerText = '▶ Resume';
                displayMeaning.innerText = "Paused";
                displayKeys.style.visibility = 'hidden';
                displayFeedback.style.opacity = '0';
            } else {
                e.target.innerText = '⏸ Pause';
                setNextPrompt();
            }
        });

        document.getElementById('dark-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        hrToggle.addEventListener('change', () => { isShortcutTurn = true; resetGame(); });
        hintsToggle.addEventListener('change', () => { 
            if (isValidated && !isPaused) displayKeys.style.visibility = hintsToggle.checked ? 'hidden' : 'visible'; 
        });
    </script>
</body>
</html>
