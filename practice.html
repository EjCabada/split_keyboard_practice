<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanata Chord Practice</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #display {
            font-size: 8rem;
            font-weight: bold;
            color: black;
            transition: color 0.15s ease-in-out;
            user-select: none;
        }

        #status {
            position: absolute;
            bottom: 2rem;
            font-size: 1.2rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="display">Press any key to start</div>
    <div id="status">Mode: Waiting...</div>

    <script>
        // --- Configuration Data ---
        const homeRow = ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ',', '.'];
        const shortcuts = [
            'Cmd + a', 'Cmd + t', 'Cmd + y', 'Cmd + o', 'Cmd + p', 'Cmd + q', 
            'Cmd + w', 'Cmd + c', 'Cmd + v', 'Cmd + z', 'Cmd + x', 'Cmd + s',
            'Alt + 1', 'Alt + 2', 'Alt + 3', 'Alt + 4', 'Alt + 5', 'Alt + 6', 
            'Alt + q', 'Alt + w',
            'Cmd + Shift + t', 'Cmd + Shift + .'
        ];

        // Map Kanata F-keys back to logical modifiers
        const modMap = {
            'F13': 'Shift', 'F20': 'Shift',
            'F14': 'Ctrl',  'F19': 'Ctrl',
            'F15': 'Alt',   'F18': 'Alt',
            'F16': 'Cmd',   'F17': 'Cmd'
        };

        // --- State Variables ---
        let activeMods = new Set();
        let isShortcutTurn = false;
        let currentTarget = "";
        let retryQueue = [];
        let hasFailedCurrent = false;
        let gameStarted = false;

        const displayEl = document.getElementById('display');
        const statusEl = document.getElementById('status');

        // --- Helper Functions ---
        const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
        
        const normalizeTarget = (str) => {
            // Converts "Cmd + Shift + t" into "cmd+shift+t" for exact matching
            return str.toLowerCase().replace(/\s+/g, '');
        };

        function setNextPrompt() {
            hasFailedCurrent = false;

            if (isShortcutTurn) {
                statusEl.innerText = "Mode: Shortcut";
                if (retryQueue.length > 0) {
                    currentTarget = retryQueue.shift();
                } else {
                    currentTarget = pickRandom(shortcuts);
                }
            } else {
                statusEl.innerText = "Mode: Home Row Recovery";
                currentTarget = pickRandom(homeRow);
            }

            displayEl.innerText = currentTarget;
            displayEl.style.color = 'black';
        }

        // --- Event Listeners ---
        window.addEventListener('keydown', (e) => {
            e.preventDefault(); // Prevent accidental browser shortcuts
            if (e.repeat) return; // Ignore keys held down repeating natively

            if (!gameStarted) {
                gameStarted = true;
                setNextPrompt();
                return;
            }

            // Register Modifier
            if (modMap[e.key]) {
                activeMods.add(modMap[e.key]);
                return;
            }

            // If a standard key is pressed, evaluate the total chord
            let key = e.key.toLowerCase();
            let chordArr = [];
            
            // Order matters for the string match
            if (activeMods.has('Cmd')) chordArr.push('cmd');
            if (activeMods.has('Ctrl')) chordArr.push('ctrl');
            if (activeMods.has('Alt')) chordArr.push('alt');
            if (activeMods.has('Shift')) chordArr.push('shift');
            chordArr.push(key);

            let pressedString = chordArr.join('+');
            let targetString = normalizeTarget(currentTarget);

            if (pressedString === targetString) {
                // Success State
                displayEl.style.color = '#10b981'; // Green
                isShortcutTurn = !isShortcutTurn; // Alternate modes
                
                // Clear modifiers to prevent sticky keys on transition
                activeMods.clear(); 
                
                setTimeout(setNextPrompt, 150);
            } else {
                // Error State
                displayEl.style.color = '#ef4444'; // Red
                
                // Queue the penalty repetitions if it's a shortcut and hasn't been queued yet this turn
                if (isShortcutTurn && !hasFailedCurrent) {
                    retryQueue.push(currentTarget, currentTarget, currentTarget);
                    hasFailedCurrent = true;
                }

                setTimeout(() => {
                    displayEl.style.color = 'black';
                }, 200);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (modMap[e.key]) {
                activeMods.delete(modMap[e.key]);
            }
        });
    </script>
</body>
</html>
